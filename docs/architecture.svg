<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>WinSync 架构：两台 Windows 经 Linux 无状态中继同步</title>
  <desc>Windows A 与 Windows B 各自主动出站连接到 Linux 中继服务器，服务器只做配对与转发，不存储任何文件。两台 Windows 之间无法直连。</desc>

  <rect width="900" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Windows A -->
  <rect x="40" y="40" width="270" height="240" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="62" y="68" font-size="15" font-weight="600" fill="#0C447C">Windows A</text>
  <rect x="60" y="82" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="76" y="107" font-size="13" fill="#042C53">WinSync.exe（界面）</text>
  <rect x="60" y="130" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="76" y="155" font-size="13" fill="#042C53">同步引擎 · tokio</text>
  <rect x="60" y="178" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="76" y="203" font-size="13" fill="#042C53">state.db　共识快照</text>
  <rect x="60" y="226" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="76" y="251" font-size="13" fill="#042C53">同步目录　D:\Sync</text>

  <!-- Windows B -->
  <rect x="590" y="40" width="270" height="240" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="612" y="68" font-size="15" font-weight="600" fill="#0C447C">Windows B</text>
  <rect x="610" y="82" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="626" y="107" font-size="13" fill="#042C53">WinSync.exe（界面）</text>
  <rect x="610" y="130" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="626" y="155" font-size="13" fill="#042C53">同步引擎 · tokio</text>
  <rect x="610" y="178" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="626" y="203" font-size="13" fill="#042C53">state.db　共识快照</text>
  <rect x="610" y="226" width="230" height="40" rx="7" fill="#ffffff" stroke="#85B7EB" stroke-width="1"/>
  <text x="626" y="251" font-size="13" fill="#042C53">同步目录　D:\Sync</text>

  <!-- 不可直连 -->
  <line x1="312" y1="160" x2="432" y2="160" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="468" y1="160" x2="588" y2="160" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path d="M441 151L459 169" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"/>
  <path d="M459 151L441 169" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"/>
  <text x="450" y="138" font-size="12" fill="#A32D2D" text-anchor="middle">无法直连</text>

  <!-- 连线 -->
  <path d="M175 280 L370 372" fill="none" stroke="#378ADD" stroke-width="1.8" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <path d="M725 280 L530 372" fill="none" stroke="#378ADD" stroke-width="1.8" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <text x="215" y="330" font-size="12" fill="#185FA5">出站 WebSocket</text>
  <text x="560" y="330" font-size="12" fill="#185FA5" text-anchor="end">出站 WebSocket</text>

  <!-- Linux 中继 -->
  <rect x="290" y="378" width="320" height="132" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="406" font-size="15" font-weight="600" fill="#04342C" text-anchor="middle">Linux 中继服务器</text>
  <text x="450" y="432" font-size="13" fill="#085041" text-anchor="middle">按房间配对两台设备</text>
  <text x="450" y="454" font-size="13" fill="#085041" text-anchor="middle">在配对连接间原样转发帧</text>
  <text x="450" y="476" font-size="13" font-weight="600" fill="#993C1D" text-anchor="middle">不落盘 · 无数据库 · 可随时重启</text>
  <text x="450" y="498" font-size="12" fill="#5F5E5A" text-anchor="middle">磁盘写入次数：0</text>

  <text x="450" y="532" font-size="12" fill="#5F5E5A" text-anchor="middle">数据只存在于两端的本地磁盘，服务器只做转发</text>
</svg>
