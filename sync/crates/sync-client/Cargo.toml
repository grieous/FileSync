[package]
name = "sync-client"
version.workspace = true
edition.workspace = true

[dependencies]
sync-proto.workspace = true
sync-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
clap.workspace = true
serde.workspace = true
uuid.workspace = true
serde_json.workspace = true
notify.workspace = true

# 图形界面：eframe + glow（OpenGL 后端，比 wgpu 编译快、体积小）
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
# 选择文件夹的系统对话框
rfd = "0.15"
# 系统托盘图标与右键菜单
tray-icon = "0.19"

# Windows 控制台默认是代码页 936，Rust 输出 UTF-8 中文会乱码，需要显式切到 65001
# 另外用到 Threading / Foundation 做单实例互斥体
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# 版本资源由 build.rs 直接调用 SDK 的 rc.exe 生成（不依赖 reg.exe）

